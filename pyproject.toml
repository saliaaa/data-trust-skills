[project]
name = "data-trust-skills"
version = "0.1.0"
description = "Agent skills that check whether a dashboard number is right."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Levan" }]
dependencies = [
    "duckdb==2.0.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
