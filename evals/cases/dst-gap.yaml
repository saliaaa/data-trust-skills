id: dst-gap
skill: test-time-semantics
summary: A naive local timestamp sits in the America/New_York hour that does not exist on 2024-03-10.
setup_sql: |
  CREATE TABLE events (
    ts TIMESTAMP,
    amount DECIMAL(12, 2)
  );
  INSERT INTO events VALUES (TIMESTAMP '2024-03-10 02:30:00', 10.00::DECIMAL(12, 2));
source_sql: SELECT ts, amount FROM events
arguments:
  timestamp_column: ts
  storage: local_timestamp
  stored_timezone: America/New_York
  business_timezone: America/New_York
  model_date_sql: CAST(ts AS DATE)
  measure_sql: amount
expect:
  exit_code: 2
  finding_codes: [dst_gap]
  min_values:
    gap_rows: 1
